<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Audio Test</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0a0a0a;
      color: #f5f0e8;
      font-family: 'DM Sans', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      gap: 2rem;
    }
    h1 { color: #c9a84c; font-size: 1.5rem; }
    p { color: rgba(245,240,232,0.6); font-size: 0.9rem; }
    .play-btn {
      width: 100px;
      height: 100px;
      border-radius: 50%;
      border: 3px solid #c9a84c;
      background: rgba(201,168,76,0.1);
      color: #c9a84c;
      font-size: 2.5rem;
      cursor: pointer;
      transition: all 0.3s ease;
    }
    .play-btn:hover {
      background: rgba(201,168,76,0.2);
      box-shadow: 0 0 40px rgba(201,168,76,0.3);
      transform: scale(1.05);
    }
    .play-btn:active { transform: scale(0.95); }
    .status {
      font-family: monospace;
      color: #c9a84c;
      font-size: 0.85rem;
      min-height: 1.5em;
    }
  </style>
</head>
<body>
  <h1>🎙️ Voice Note Test</h1>
  <p>Tap the button to play</p>

  <button class="play-btn" id="playBtn">▶</button>

  <div class="status" id="status"></div>

  <audio id="testAudio" preload="auto">
    <source src="assets/voice-note.mp3" type="audio/mpeg">
    <source src="assets/voice-note.ogg" type="audio/ogg">
  </audio>

  <script>
    const btn = document.getElementById('playBtn');
    const audio = document.getElementById('testAudio');
    const status = document.getElementById('status');
    let playing = false;

    // Log audio events for debugging
    audio.addEventListener('canplay', () => { status.textContent = 'Ready to play'; });
    audio.addEventListener('error', (e) => {
      status.textContent = 'Error: ' + (audio.error ? audio.error.message : 'unknown');
      console.error('Audio error:', audio.error);
    });

    btn.addEventListener('click', () => {
      if (playing) {
        audio.pause();
        btn.textContent = '▶';
        status.textContent = 'Paused';
        playing = false;
      } else {
        audio.play().then(() => {
          btn.textContent = '⏸';
          status.textContent = 'Playing...';
          playing = true;
        }).catch(err => {
          status.textContent = 'Play failed: ' + err.message;
          console.error(err);
        });
      }
    });

    audio.addEventListener('timeupdate', () => {
      if (playing && audio.duration) {
        const secs = Math.floor(audio.currentTime);
        const total = Math.floor(audio.duration);
        status.textContent = `Playing... ${secs}s / ${total}s`;
      }
    });

    audio.addEventListener('ended', () => {
      btn.textContent = '▶';
      status.textContent = 'Finished ✓';
      playing = false;
    });
  </script>
</body>
</html>
